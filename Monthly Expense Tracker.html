.r2{grid-template-columns:1fr 1.4fr;margin-bottom:12px}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--sh);animation:up .4s both}

.kv{font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kl{font-size:12px;color:var(--mu)}
.k .p:first-child{grid-column:1/-1;background:var(--hero);border:0;color:#fff;padding:20px;position:relative;overflow:hidden}
.k .p:first-child::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}

.k .p:first-child .kv{font-size:38px}
.k .p:first-child .up,.k .p:first-child .dn{color:#fff;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px;display:inline-block;margin-top:6px;font-weight:600}
.k .p:nth-child(n+2) .kl::before{margin-right:5px}
.k .p:nth-child(2) .kl::before{content:"💰"}.k .p:nth-child(3) .kl::before{content:"⚖️"}.k .p:nth-child(4) .kl::before{content:"📅"}.k .p:nth-child(5) .kl::before{content:"🏆"}.k .p:nth-child(6) .kl::before{content:"🏧"}
.up{color:var(--bad)}.dn{color:var(--ac)}

.cr:hover,.cr.on{background:color-mix(in srgb,var(--ac) 11%,var(--sf))}
.ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:8px;font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden}

.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dn2{display:flex;justify-content:center;margin:2px 0 14px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}

.ax{display:flex;gap:3px;font-size:10px;color:var(--mu);margin-top:4px}.ax span{flex:1;text-align:center;overflow:hidden}
.ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;min-width:0}
.btn{background:var(--hero);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(15,118,110,.25);transition:.15s}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--sf)}
tbody tr:hover{background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
td.num,th.num{text-align:right}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px}
.mu{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
